[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-5B0A0072491
upload_port = /dev/cu.usbserial-5B0A0072491
build_flags = 
  -DCORE_DEBUG_LEVEL=5
  -DUSER_SETUP_LOADED=1
  -Iinclude
lib_deps = 
  bodmer/TFT_eSPI@^2.5.43

[env:native]
platform = native
